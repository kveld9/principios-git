name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Principle of least privilege: explicitly restrict default token permissions to read-only
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    name: Repository Standards & Integrity Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify executable permissions on scripts
        run: |
          test -x scripts/check-repo.sh || { echo "::error::scripts/check-repo.sh is not executable (fix: git update-index --chmod=+x scripts/check-repo.sh)" >&2; exit 1; }
          test -x scripts/new-repo.sh || { echo "::error::scripts/new-repo.sh is not executable (fix: git update-index --chmod=+x scripts/new-repo.sh)" >&2; exit 1; }

      - name: Verify no emojis in execution surfaces
        run: |
          echo "Scanning execution surfaces for prohibited emojis..."
          TARGETS=(
            scripts/
            .github/workflows/
            .github/dependabot.yml
            .github/settings.example.yml
            .github/CODEOWNERS.example
            .editorconfig
            .gitattributes
            .gitignore
          )
          for extra_dir in src lib bin; do
            if [[ -d "$extra_dir" ]]; then
              TARGETS+=("$extra_dir/")
            fi
          done
          if grep -rnP '[\x{1F000}-\x{1FAFF}\x{2600}-\x{27BF}]' "${TARGETS[@]}"; then
            echo "::error::Prohibited emojis detected in execution surfaces (scripts, configs, workflows)." >&2
            echo "Emojis are strictly forbidden in code, scripts, configs, and CI workflows." >&2
            echo "Permitted only in human-facing documentation (README.md, docs/**) and release notes." >&2
            exit 1
          fi
          echo "All execution surfaces are clean of emojis."

      - name: Run Repository Standards Audit
        run: ./scripts/check-repo.sh

  lint-markdown:
    name: Markdown Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lint Markdown Files
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            **/*.md
            !node_modules
