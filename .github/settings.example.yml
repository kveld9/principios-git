# GitHub Repository Settings & Branch Protection Specification
#
# This file serves as an explicit specification and blueprint for repository
# settings and branch protection rules. It is compatible with probot/settings
# and maps directly to GitHub's REST API and UI settings.
#
# Documentation:
# https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository

repository:
  # General repository configuration
  name: principios-git
  description: "Repository standards, engineering principles, and automated setup kit"
  homepage: ""
  topics: "git, github, standards, devops, engineering-best-practices"
  private: false
  has_issues: true
  has_projects: false
  has_wiki: false
  has_downloads: false

  # Merge strategies
  # Disallow standard merge commits to keep git history linear and clean
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: true
  # Automatically delete head branches after pull requests are merged
  delete_branch_on_merge: true
  # Encourage squash commit messages to default to PR title and commit details
  squash_merge_commit_title: "PR_TITLE"
  squash_merge_commit_message: "PR_BODY"

branches:
  - name: main
    protection:
      # Require all status checks to pass before merging
      required_status_checks:
        strict: true
        contexts:
          - "Repository Standards & Integrity Check"
          - "Markdown Quality Check"

      # Enforce restrictions for administrators as well
      enforce_admins: true

      # Require code reviews before merging
      required_pull_request_reviews:
        dismiss_stale_reviews: true
        require_code_owner_reviews: true
        required_approving_review_count: 1
        require_last_push_approval: true

      # Prevent force pushes and branch deletions
      allow_force_pushes: false
      allow_deletions: false

      # Require linear git history (no merge commits)
      required_linear_history: true

      # Require conversation resolution before merging
      required_conversation_resolution: true

      # Require signed commits (recommended for production repositories)
      required_signatures: false
